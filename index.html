<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a31">
  <meta name="description" content="画面の上下をタップして2つの時間を独立して測れるストップウォッチ。オフラインでも使用できます。">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="デュアル計測">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>デュアルストップウォッチ</title>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="stopwatches" aria-label="2つのストップウォッチ">
    <button class="timer-panel timer-panel--one" id="timer-one" type="button" aria-label="ストップウォッチ1を開始" aria-pressed="false">
      <span class="panel-content">
        <span class="timer-label"><span class="timer-dot" aria-hidden="true"></span> STOPWATCH <span class="timer-number">01</span></span>
        <span class="timer-value" id="time-one" role="timer" aria-live="off" aria-atomic="true">00:00:00.00</span>
        <span class="timer-action" id="action-one">タップして開始</span>
        <span class="status-row"><span class="status-indicator" aria-hidden="true"></span><span id="status-one">待機中</span></span>
      </span>
    </button>

    <button class="timer-panel timer-panel--two" id="timer-two" type="button" aria-label="ストップウォッチ2を開始" aria-pressed="false">
      <span class="panel-content">
        <span class="timer-label"><span class="timer-dot" aria-hidden="true"></span> STOPWATCH <span class="timer-number">02</span></span>
        <span class="timer-value" id="time-two" role="timer" aria-live="off" aria-atomic="true">00:00:00.00</span>
        <span class="timer-action" id="action-two">タップして開始</span>
        <span class="status-row"><span class="status-indicator" aria-hidden="true"></span><span id="status-two">待機中</span></span>
      </span>
    </button>

    <a class="reminder-button" href="./reminder.html" aria-label="毎日21時・膝コゾの通知設定" title="通知設定">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>
      </svg>
    </a>

    <div class="middle-control">
      <button class="reset-button" id="reset-button" type="button" aria-haspopup="dialog" aria-controls="reset-dialog">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span>両方リセット</span>
      </button>
    </div>
  </main>

  <dialog id="reset-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="dialog-symbol" aria-hidden="true">↻</div>
    <h2 id="confirm-title">両方リセットしますか？</h2>
    <p id="confirm-message">2つの計測時間がどちらも 00:00:00.00 に戻ります。この操作は元に戻せません。</p>
    <div class="dialog-actions">
      <button type="button" class="dialog-button dialog-button--cancel" id="cancel-reset">キャンセル</button>
      <button type="button" class="dialog-button dialog-button--confirm" id="confirm-reset">リセットする</button>
    </div>
  </dialog>
</body>
</html>
